question: Why is the Trio cheaper per case study?
answer:
  - "When you commission three case studies together, we batch the production workflow for efficiency. Instead of three separate customer interview scheduling windows, three separate editing sprints, and three separate delivery rounds, we conduct all three interviews in a single week, edit all three in one production sprint, and deliver all three at once."
  - "The fixed overhead — scheduling coordination, project setup, and delivery — gets shared across three case studies instead of one, so we pass those savings directly to you. The per-case-study price drops from $4,500 (Single) to $3,500 (Trio)."
