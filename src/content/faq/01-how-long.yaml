order: 1
question: How long does a case study take?
answer:
  - "About three weeks end to end. Week 1 is the customer interview. Weeks 2 to 3 we edit the video and write the case study. Week 3+ is one consolidated round of revisions and final delivery. First drafts land 14 business days after the interview."
  - "Timeline depends on customer availability. We work around your client's schedule for the interview, and once we have the footage, we control the production timeline. Most delays come from waiting for customer responses or internal approvals, not from our process."
