order: 1
question: How long does a case study take?
answer:
  - "A Single case study takes 2–3 weeks from initial customer interview to final delivery. The Trio takes 3–6 weeks total because we batch three interviews in the same window and run them through a single editing pipeline."
  - "Timeline depends on customer availability — we work around your client's schedule for the interview, and once we have interview footage, we control the production timeline. Most delays come from waiting for customer responses or internal approval cycles, not from our production process."
