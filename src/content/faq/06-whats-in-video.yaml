question: "What do I get with the video case study?"
answer:
  - "The written case study, a 2 to 3 minute customer video, a 30 to 60 second cut for your homepage and emails, videos for social media, a LinkedIn carousel, a pull-quote and short summary your sales team can paste into an email, and a one-page guide to which piece to send at which stage of a deal."
order: 6
